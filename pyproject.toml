[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatwell"
version = "0.3.1"
description = "Multi-character conversation CLI for llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chatwell = "chatwell.__main__:main"

[tool.setuptools.packages.find]
include = ["chatwell*"]

[tool.setuptools.package-data]
chatwell = ["prompts/*.txt"]
